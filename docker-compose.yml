name: ${COMPOSE_PROJECT_NAME}

services:
  app:
    container_name: ${APP_CONTAINER_NAME}
    build:
      context: ./docker/php
    volumes:
      - ./app:/app
    working_dir: /app
    user: "${APP_USER_ID}:${APP_GROUP_ID}"

  web:
    image: nginx:stable-alpine
    container_name: ${WEB_CONTAINER_NAME}
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./app:/app
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
